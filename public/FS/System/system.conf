# eOS Desktop System Configuration
# Version: 2.1.0-LIQUID

[system]
name = eOS Desktop
version = 2.1.0-LIQUID
kernel = eOS-Darwin 23.0
build = 2024.1
codename = Liquid Glass

[hardware]
model = Macbook 13 Pro
processor = Apple M3 Pro
memory = 18 GB
storage = 256 GB
display = 2560x1600 Retina

[user]
default_name = ivan
home_directory = /users/ivan
shell = /bin/eos-sh

[appearance]
default_theme = dark
accent_color = #007aff
wallpaper = sonoma
dock_magnification = true
transparency = 0.95

[network]
hostname = eos-desktop
default_interface = en0
firewall = enabled

[security]
rbac_default_level = SYSTEM_ADMIN
sandbox_apps = true
require_permissions = true

[apps]
system_directory = /public/apps/system
user_directory = /users/ivan/Applications
auto_update = true

[filesystem]
virtual_root = /
case_sensitive = false
max_file_size = 100MB
supported_formats = eapp,txt,pdf,jpg,png

[logging]
enabled = true
level = info
log_directory = /var/log/eos

[debug]
developer_mode = false
show_fps = false
verbose_logging = false
